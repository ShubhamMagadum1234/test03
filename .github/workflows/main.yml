
name: pipeline 

on:
  push:
    branches:
      -main:

jobs:
    job1:
    runs-on: ubantu_latest

    steps:
      -name : job1
      run: python job1.py


    job2:
    needs: job1
    runs-on: ubantu_latest

    steps:
      -name : job1
      run: python job2.py

    job3:
    needs: job1
    runs-on: ubantu_latest

    steps:
      -name : job1
      run: python job3.py

    job4:
    needs: job2
    runs-on: ubantu_latest

    steps:
      -name : job4
      run: python job4.py

    job5:
    needs: job3
    runs-on: ubantu_latest

    steps:
      -name : job5
      run: python job5.py

    job6:
    needs: [job4,job5]
    runs-on: ubantu_latest

    steps:
      -name : job6
      run: python job6.py
