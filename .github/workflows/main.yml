
name: pipeline 

on:
  push:
    branches:
      -main:

job:
    job1:
    runs-on: ubantu_latest

    steps:
      -name : job1
      run: python job1.py

job:
    job2:
    needs: job1
    runs-on: ubantu_latest

    steps:
      -name : job1
      run: python job2.py

job:
    job3:
    needs: job1
    runs-on: ubantu_latest

    steps:
      -name : job1
      run: python job3.py
job:
    job4:
    needs: job2
    runs-on: ubantu_latest

    steps:
      -name : job4
      run: python job4.py
job:
    job5:
    needs: job3
    runs-on: ubantu_latest

    steps:
      -name : job5
      run: python job5.py
job:
    job6:
    needs: [job4,job5]
    runs-on: ubantu_latest

    steps:
      -name : job6
      run: python job6.py
